system_under_test: package-sim
milestone: M3
status: Designed
requirement_ids:
  - REQ-INT-007
acceptance_criteria:
  - REQ-INT-007 AC-1
  - REQ-INT-007 AC-2
  - REQ-INT-007 AC-3
  - REQ-INT-007 AC-4
technique: Decision Table Testing
priority: High
automation_intent: later-api-with-defect-switch

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Package Sim</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <p class="banner" data-testid="simulated-banner">{{ disclaimer }}</p>
  <header>
    <a class="brand" href="/">Package Sim</a>
    <nav>
      <a href="/learning" data-testid="nav-learning">Learning</a>
      <a href="/quality" data-testid="nav-quality">Quality</a>
      <a href="/workorders" data-testid="nav-workorders">Work orders</a>
      <a href="/defects" data-testid="nav-defects">Defects</a>
    </nav>
  </header>
  <main>
    {% if error %}
    <p class="error" role="alert" data-testid="error">{{ error }}</p>
    {% endif %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
